
name: Zameen Hisab APK AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Project Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android Project
        run: pnpm --filter @workspace/zameen-calculator-balochistan exec expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: artifacts/zameen-calculator-balochistan/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build AAB
        working-directory: artifacts/zameen-calculator-balochistan/android
        run: ./gradlew bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Zameen-Calculator
          path: |
            artifacts/zameen-calculator-balochistan/android/app/build/outputs/apk/release/*.apk
            artifacts/zameen-calculator-balochistan/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
