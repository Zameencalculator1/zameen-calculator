name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          ls -la
          unzip -o "Zameen-Hisab.zip" -d temp || true
          # zip ka andar wala folder bahar nikalo
          cp -r temp/*/*. 2>/dev/null || cp -r temp/*. 2>/dev/null || true
          cp -r temp/*. 2>/dev/null || true
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --clean --non-interactive || npx expo prebuild --platform android --non-interactive
      - run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Zameen-Hisab-AAB
          path: android/app/build/outputs/bundle/release/*.aab
