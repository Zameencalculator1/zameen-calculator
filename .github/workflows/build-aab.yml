
name: Zameen Hisab Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android Project
        working-directory: artifacts/zameen-calculator-balochistan
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Build APK and AAB
        working-directory: artifacts/zameen-calculator-balochistan/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Zameen-Hisab-Android
          path: |
            artifacts/zameen-calculator-balochistan/android/app/build/outputs/apk/release/*.apk
            artifacts/zameen-calculator-balochistan/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
          
