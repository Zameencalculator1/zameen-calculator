name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app_build
          unzip -o Zameen-Hisab.zip -d app_build
          mv app_build/*/*. 2>/dev/null || true
          mv app_build/*. 2>/dev/null || true
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: npm install
      - name: Prebuild android
        run: npx expo prebuild --platform android --non-interactive || true
      - name: Make AAB
        run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Zameen-Hisab-AAB
          path: android/app/build/outputs/bundle/release/*.aab
