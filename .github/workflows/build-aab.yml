name: Build Zameen Hisab AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Extract and Detect Project
        shell: bash
        run: |
          set -e

          if [ -f "Zameen-Hisab.zip" ]; then
            mkdir -p project
            unzip -oq Zameen-Hisab.zip -d project
          fi

          if [ -f "package.json" ]; then
            ROOT="."
          else
            PACKAGE=$(find project -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/.expo/*' \
              -print -quit)

            if [ -z "$PACKAGE" ]; then
              echo "ERROR: package.json not found"
              exit 1
            fi

            ROOT=$(dirname "$PACKAGE")
          fi

          WORKSPACE=$(find "$ROOT" -name pnpm-workspace.yaml \
            -not -path '*/node_modules/*' -print -quit)

          if [ -n "$WORKSPACE" ]; then
            ROOT=$(dirname "$WORKSPACE")
          fi

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

          echo "Project directory: $ROOT"
          ls -la "$ROOT"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Check Expo
        run: pnpm exec expo --version
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Generate Android
        run: pnpm exec expo prebuild --platform android --clean --non-interactive
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Zameen-Hisab-AAB
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
