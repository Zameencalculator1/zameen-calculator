name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          rm -rf android
          unzip -o Zameen-Hisab.zip -d.
          if [! -f package.json ]; then
            FOLDER=$(find. -maxdepth 2 -type f -name "package.json" | head -1 | xargs dirname)
            cp -r $FOLDER/..
          fi
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --clean --non-interactive
      - run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Zameen-Hisab-AAB
          path: android/app/build/outputs/bundle/release/*.aab
