name: Build Zameen Hisab AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Project
        shell: bash
        run: |
          set -e

          if [ -f "Zameen-Hisab.zip" ]; then
            mkdir -p project
            unzip -oq Zameen-Hisab.zip -d project
          fi

          if [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            PACKAGE=$(find project -name package.json -not -path '*/node_modules/*' -print -quit)

            if [ -z "$PACKAGE" ]; then
              echo "ERROR: package.json not found"
              find . -maxdepth 4 -type f
              exit 1
            fi

            echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Check Expo
        run: npx expo --version
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Generate Android
        run: npx expo prebuild --platform android --clean --non-interactive
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Zameen-Hisab-AAB
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
