name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          ls -la
          if [ -f "Zameen-Hisab.zip" ]; then
            rm -rf temp_app
            unzip -o Zameen-Hisab.zip -d temp_app
            cp -r temp_app/*/*. 2>/dev/null || true
            cp -r temp_app/*. 2>/dev/null || true
            cp -r temp_app/*/.. 2>/dev/null || true
          fi
          ls -la
          cat package.json | head -20
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo prebuild --platform android --non-interactive --clean || npx expo prebuild --platform android --non-interactive
      - run: cd android && chmod +x gradlew &&./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Zameen-Hisab-AAB
          path: android/app/build/outputs/bundle/release/*.aab
